<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Guest List</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231f3a32'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='32' fill='%23d3ad63' text-anchor='middle'%3E75%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Jost:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <p class="banner wide" id="preview-banner" hidden>Preview mode. The passphrase is “preview” and changes stay in this browser.</p>

  <!-- Sign in -->
  <main class="card center" id="gate">
    <p class="eyebrow">Peggy’s 75th</p>
    <h1>Guest list</h1>
    <form id="gate-form" style="display:flex;flex-direction:column;gap:14px;text-align:left">
      <div class="field">
        <label class="label" for="pass">Passphrase</label>
        <input type="password" id="pass" autocomplete="current-password" required>
      </div>
      <button class="btn block" type="submit">Open</button>
      <p class="status" id="gate-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <!-- List -->
  <main class="card wide" id="app" hidden>
    <div class="host-head">
      <div>
        <p class="eyebrow">Peggy’s 75th · December 19</p>
        <h1>Guest list</h1>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn ghost small" type="button" id="refresh">Refresh</button>
        <button class="btn ghost small" type="button" id="signout">Lock</button>
      </div>
    </div>

    <dl class="totals" aria-label="Totals">
      <div><dt>Coming</dt><dd id="t-coming">0</dd></div>
      <div><dt>Can’t</dt><dd id="t-no">0</dd></div>
      <div><dt>Waiting</dt><dd id="t-wait">0</dd></div>
      <div><dt>Invites</dt><dd id="t-all">0</dd></div>
    </dl>

    <section class="panel" aria-labelledby="add-h">
      <h2 id="add-h">Add a guest</h2>
      <form id="add-form" class="grid2" novalidate>
        <div class="field span">
          <label class="label" for="g-name">Name on the invite</label>
          <input type="text" id="g-name" placeholder="Carol and Jim" maxlength="120" required>
        </div>
        <div class="field">
          <label class="label" for="g-phone">Mobile</label>
          <input type="tel" id="g-phone" autocomplete="off" maxlength="40">
        </div>
        <div class="field">
          <label class="label" for="g-email">Email</label>
          <input type="email" id="g-email" autocomplete="off" maxlength="200">
        </div>
        <div class="field">
          <label class="label" for="g-seats">Seats</label>
          <input type="number" id="g-seats" min="1" max="20" value="2" inputmode="numeric">
        </div>
        <div class="field" style="justify-content:flex-end">
          <button class="btn block" type="submit" id="add-btn">Add guest</button>
        </div>
        <p class="status span" id="add-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel" aria-labelledby="open-h">
      <h2 id="open-h">Open invite link</h2>
      <p class="by" style="text-align:left;margin:0">For anyone not on the list. They type their name when they reply.</p>
      <div class="linkbox">
        <code id="open-link"></code>
        <button class="btn ghost small" type="button" id="copy-open">Copy</button>
      </div>
    </section>

    <section class="panel" aria-labelledby="list-h">
      <h2 id="list-h">Guests</h2>
      <div class="filters" role="group" aria-label="Show">
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="yes" aria-pressed="false">Coming</button>
        <button type="button" data-f="no" aria-pressed="false">Can’t</button>
        <button type="button" data-f="wait" aria-pressed="false">Waiting</button>
        <button type="button" data-f="unopened" aria-pressed="false">Not opened</button>
      </div>
      <ul class="guests" id="guests"></ul>
      <p class="status" id="list-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/host.js"></script>
</body>
</html>
