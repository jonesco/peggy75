<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Link preview card</title>
  <!-- The image texts and emails show for the invite link. og/card.png is a 1200 by 630
       screenshot of this page. Re-shoot it if the date, time or place changes. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@400;500&display=swap">
  <style>
    :root { --paper: #eef1ec; --card: #fbfcfa; --ink: #1f3a32; --muted: #5d6f68; --gold: #a07a2c; --rule: #d5ddd7; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: var(--paper); color: var(--ink); font-family: "Jost", sans-serif; padding: 24px; }
    .card {
      height: 100%; background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
      display: grid; grid-template-columns: 540px 1fr; align-items: center;
    }
    .art { display: flex; justify-content: center; align-items: center; height: 100%; }
    .num-wrap { position: relative; font-size: 250px; margin-top: 0.12em; }
    .doodle { position: absolute; left: 50%; top: 50%; width: 1.8em; height: 1.1em; transform: translate(-50%, -50%); overflow: visible; }
    .doodle .rays path { fill: none; stroke: var(--gold); stroke-linecap: round; }
    .doodle .sparks path, .doodle .sparks circle { fill: var(--gold); }
    .num { font-family: "Bodoni Moda", serif; font-size: 1em; line-height: 0.9; color: var(--gold); margin: 0; font-variant-numeric: lining-nums; }
    .text { padding: 0 48px 0 24px; display: flex; flex-direction: column; gap: 14px; }
    .eyebrow { font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin: 0; }
    h1 { font-family: "Bodoni Moda", serif; font-weight: 700; font-variation-settings: "opsz" 24; font-size: 88px; line-height: 1; margin: 0; }
    .sub { font-family: "Bodoni Moda", serif; font-style: italic; font-weight: 600; font-variation-settings: "opsz" 12; font-size: 34px; color: var(--muted); margin: -4px 0 0; }
    .rule { width: 64px; height: 2px; background: var(--gold); border: 0; margin: 14px 0 10px; }
    .when { font-family: "Bodoni Moda", serif; font-weight: 600; font-variation-settings: "opsz" 12; font-size: 44px; line-height: 1.1; margin: 0; }
    .where { font-size: 30px; font-weight: 500; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="art">
      <div class="num-wrap" aria-hidden="true">
        <svg class="doodle" viewBox="0 0 180 110" focusable="false">
            <defs>
              <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="3"/>
                <feDisplacementMap in="SourceGraphic" scale="3"/>
              </filter>
            </defs>
            <g class="rays" filter="url(#wobble)">
              <path pathLength="1" stroke-width="1.1" style="--d:0.78s;--f:2.26s" d="M34.0 67.5 Q 23.3 71.2, 12.6 72.7"/>
              <path pathLength="1" stroke-width="0.58" style="--d:0.66s;--f:2.32s" d="M34.0 60.0 Q 29.3 61.3, 25.7 60.9"/>
              <path pathLength="1" stroke-width="1.0" style="--d:0.64s;--f:2.42s" d="M34.0 47.3 Q 23.3 46.6, 14.0 44.9"/>
              <path pathLength="1" stroke-width="0.72" style="--d:0.61s;--f:2.43s" d="M34.0 31.5 Q 28.7 30.0, 23.8 27.4"/>
              <path pathLength="1" stroke-width="1.3" style="--d:0.58s;--f:2.17s" d="M34.0 17.7 Q 27.6 14.5, 19.2 8.1"/>
              <path pathLength="1" stroke-width="0.54" style="--d:0.5s;--f:1.97s" d="M37.7 4.0 Q 34.5 1.3, 30.0 -3.4"/>
              <path pathLength="1" stroke-width="0.96" style="--d:0.44s;--f:2.6s" d="M57.1 4.0 Q 52.8 -1.2, 48.8 -8.6"/>
              <path pathLength="1" stroke-width="0.57" style="--d:0.35s;--f:2.4s" d="M67.3 4.0 Q 65.8 0.4, 62.6 -6.5"/>
              <path pathLength="1" stroke-width="1.04" style="--d:0.33s;--f:2.98s" d="M76.8 4.0 Q 73.5 -4.4, 71.4 -14.0"/>
              <path pathLength="1" stroke-width="0.56" style="--d:0.3s;--f:3.0s" d="M89.7 4.0 Q 90.1 0.2, 89.7 -4.5"/>
              <path pathLength="1" stroke-width="0.91" style="--d:0.33s;--f:2.24s" d="M97.5 4.0 Q 98.6 -2.4, 99.8 -11.4"/>
              <path pathLength="1" stroke-width="0.53" style="--d:0.4s;--f:3.21s" d="M108.2 4.0 Q 109.0 1.4, 110.9 -3.4"/>

              <path pathLength="1" stroke-width="0.79" style="--d:0.47s;--f:2.61s" d="M146.0 7.5 Q 150.6 5.0, 155.0 0.0"/>
              <path pathLength="1" stroke-width="1.0" style="--d:0.54s;--f:3.0s" d="M146.0 14.5 Q 155.3 8.9, 164.0 1.9"/>
              <path pathLength="1" stroke-width="0.77" style="--d:0.61s;--f:3.33s" d="M146.0 30.3 Q 150.0 29.4, 153.9 27.0"/>
              <path pathLength="1" stroke-width="1.11" style="--d:0.64s;--f:1.9s" d="M146.0 46.9 Q 156.0 46.7, 167.0 44.3"/>
              <path pathLength="1" stroke-width="0.65" style="--d:0.72s;--f:2.22s" d="M146.0 60.0 Q 149.8 62.1, 153.7 60.8"/>
              <path pathLength="1" stroke-width="1.12" style="--d:0.77s;--f:3.35s" d="M146.0 68.7 Q 154.5 72.0, 163.8 73.4"/>
            </g>
            <g class="sparks">
              <g transform="translate(7.7 73.9) scale(0.7)"><path style="--d:1.38s;--f:2.75s" d="M0 -6 C 1 -1.5, 1.5 -1, 6 0 C 1.5 1, 1 1.5, 0 6 C -1 1.5, -1.5 1, -6 0 C -1.5 -1, -1 -1.5, 0 -6 Z"/></g>
              <circle style="--d:1.11s;--f:3.67s" cx="20.5" cy="26.1" r="1"/>
              <g transform="translate(15.0 5.4) scale(1.0)"><path style="--d:1.18s;--f:3.45s" d="M0 -6 C 1 -1.5, 1.5 -1, 6 0 C 1.5 1, 1 1.5, 0 6 C -1 1.5, -1.5 1, -6 0 C -1.5 -1, -1 -1.5, 0 -6 Z"/></g>
              <circle style="--d:0.80s;--f:3.26s" cx="89.7" cy="-8.0" r="1"/>
              <g transform="translate(100.5 -16.4) scale(0.7)"><path style="--d:0.93s;--f:2.67s" d="M0 -6 C 1 -1.5, 1.5 -1, 6 0 C 1.5 1, 1 1.5, 0 6 C -1 1.5, -1.5 1, -6 0 C -1.5 -1, -1 -1.5, 0 -6 Z"/></g>
              <g transform="translate(168.0 -1.0) scale(1.0)"><path style="--d:1.14s;--f:3.18s" d="M0 -6 C 1 -1.5, 1.5 -1, 6 0 C 1.5 1, 1 1.5, 0 6 C -1 1.5, -1.5 1, -6 0 C -1.5 -1, -1 -1.5, 0 -6 Z"/></g>
              <circle style="--d:1.11s;--f:3.11s" cx="157.2" cy="25.6" r="1"/>
              <g transform="translate(168.6 74.7) scale(0.7)"><path style="--d:1.37s;--f:3.19s" d="M0 -6 C 1 -1.5, 1.5 -1, 6 0 C 1.5 1, 1 1.5, 0 6 C -1 1.5, -1.5 1, -6 0 C -1.5 -1, -1 -1.5, 0 -6 Z"/></g>
            </g>
          </svg>
        <p class="num">75</p>
      </div>
    </div>
    <div class="text">
      <p class="eyebrow">Please join us to celebrate</p>
      <h1>Peggy Jones</h1>
      <p class="sub">turns seventy-five</p>
      <hr class="rule">
      <p class="when">Saturday, December 19</p>
      <p class="where">2 to 4 PM · Schobels’, Columbus</p>
    </div>
  </div>
</body>
</html>
