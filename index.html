<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Peggy’s 75th Birthday</title>
  <meta name="description" content="Join us to celebrate Peggy Jones turning seventy-five. Saturday, December 19, 2 to 4 PM, Schobels’ Restaurant, Columbus.">
  <meta property="og:title" content="Peggy’s 75th Birthday">
  <meta property="og:description" content="Saturday, December 19, 2 to 4 PM. Schobels’ Restaurant, Columbus. Tap to RSVP.">
  <meta name="theme-color" content="#eef1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1a17" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231f3a32'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='32' fill='%23d3ad63' text-anchor='middle'%3E75%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Jost:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <p class="banner" id="preview-banner" hidden>Preview mode. Replies are saved in this browser only.</p>

  <main class="card center">
    <p class="to" id="to" hidden></p>
    <p class="eyebrow">Please join us to celebrate</p>

    <div class="hero">
      <div class="num-wrap" aria-hidden="true">
        <svg class="doodle" viewBox="0 0 180 110" focusable="false">
          <defs>
            <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
              <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="3"/>
              <feDisplacementMap in="SourceGraphic" scale="3"/>
            </filter>
          </defs>
          <g class="lines" filter="url(#wobble)">
            <path pathLength="1" d="M42 7 C 30 11, 19 24, 15 40 C 11 56, 15 72, 25 83 C 29 87, 33 90, 37 91"/>
            <path pathLength="1" class="thin" d="M36 13 C 26 22, 19 36, 18 52 C 17 66, 21 76, 28 84"/>
            <path pathLength="1" d="M136 9 C 152 14, 163 28, 166 44 C 169 58, 167 72, 160 83 C 157 88, 152 90, 150 87 C 148 84, 152 81, 155 84"/>
            <path pathLength="1" class="thin" d="M141 6 C 156 13, 168 30, 169 48 C 170 60, 167 68, 162 75"/>
          </g>
          <g class="sparks">
            <g transform="translate(18 13) scale(1.25)"><path d="M0 -6 C 1 -1.5, 1.5 -1, 6 0 C 1.5 1, 1 1.5, 0 6 C -1 1.5, -1.5 1, -6 0 C -1.5 -1, -1 -1.5, 0 -6 Z"/></g>
            <g transform="translate(160 18) scale(0.8)"><path d="M0 -6 C 1 -1.5, 1.5 -1, 6 0 C 1.5 1, 1 1.5, 0 6 C -1 1.5, -1.5 1, -6 0 C -1.5 -1, -1 -1.5, 0 -6 Z"/></g>
            <g transform="translate(172 86) scale(1.05)"><path d="M0 -6 C 1 -1.5, 1.5 -1, 6 0 C 1.5 1, 1 1.5, 0 6 C -1 1.5, -1.5 1, -6 0 C -1.5 -1, -1 -1.5, 0 -6 Z"/></g>
            <g transform="translate(6 84) scale(0.6)"><path d="M0 -6 C 1 -1.5, 1.5 -1, 6 0 C 1.5 1, 1 1.5, 0 6 C -1 1.5, -1.5 1, -6 0 C -1.5 -1, -1 -1.5, 0 -6 Z"/></g>
            <g transform="translate(150 2) scale(0.5)"><path d="M0 -6 C 1 -1.5, 1.5 -1, 6 0 C 1.5 1, 1 1.5, 0 6 C -1 1.5, -1.5 1, -6 0 C -1.5 -1, -1 -1.5, 0 -6 Z"/></g>
            <circle cx="30" cy="2" r="1.1"/>
            <circle cx="176" cy="56" r="0.9"/>
          </g>
        </svg>
        <p class="num">75</p>
      </div>
      <h1>Peggy Jones</h1>
      <p class="sub">turns seventy-five</p>
    </div>

    <hr class="rule">

    <dl class="facts">
      <div class="fact">
        <dt>When</dt>
        <dd><span class="big">Saturday, December 19</span>2 to 4 PM</dd>
        <dd class="small"><a href="event.ics" download="peggy-75.ics">Add to calendar</a></dd>
      </div>
      <div class="fact">
        <dt>Where</dt>
        <dd><span class="big">Schobels’ Restaurant</span>
          <a href="https://www.google.com/maps/search/?api=1&amp;query=Schobels%27+Restaurant+2020+Milam+St+Columbus+TX+78934" target="_blank" rel="noopener">2020 Milam St, Columbus, TX 78934</a>
        </dd>
      </div>
    </dl>

    <section class="rsvp" aria-labelledby="rsvp-h">
      <p class="eyebrow" id="rsvp-h">RSVP</p>

      <form id="form" novalidate>
        <div style="display:flex;flex-direction:column;gap:18px">
          <h2>Will you join us?</h2>
          <p class="by" id="by" hidden></p>

          <div class="field" id="name-field" hidden>
            <label class="label" for="name">Your name</label>
            <input type="text" id="name" name="name" autocomplete="name" maxlength="120">
          </div>

          <fieldset class="choice">
            <legend class="label">Your reply</legend>
            <input type="radio" name="reply" id="r-yes" value="yes">
            <label for="r-yes">Yes, I’ll be there</label>
            <input type="radio" name="reply" id="r-no" value="no">
            <label for="r-no">Can’t make it</label>
          </fieldset>

          <div class="field" id="count-field" hidden>
            <span class="label" id="count-label">How many in your party</span>
            <div class="stepper" role="group" aria-labelledby="count-label">
              <button type="button" id="minus" aria-label="One fewer">−</button>
              <output id="count" aria-live="polite">1</output>
              <button type="button" id="plus" aria-label="One more">+</button>
            </div>
          </div>

          <div class="field">
            <label class="label" for="note">A note <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
            <textarea id="note" name="note" maxlength="500"></textarea>
          </div>

          <button class="btn block" type="submit" id="send">Send reply</button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </div>
      </form>

      <div class="done" id="done" hidden>
        <p class="big" id="done-big"></p>
        <p id="done-small"></p>
        <button class="btn ghost small" type="button" id="change">Change reply</button>
      </div>
    </section>

    <p class="foot" id="foot"></p>
  </main>

  <script src="config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/invite.js"></script>
</body>
</html>
