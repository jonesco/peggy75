    <hr class="rule">

    <dl class="facts">
      <div class="fact">
        <dt>When</dt>
        <dd><span class="big">Saturday, December 19</span>2 to 4 PM</dd>
        <dd class="small"><a href="event.ics" download="peggy-75.ics">Add to calendar</a></dd>
      </div>
      <div class="fact">
        <dt>Where</dt>
        <dd><span class="big">Schobels’ Restaurant</span>
          <a href="https://www.google.com/maps/search/?api=1&amp;query=Schobels%27+Restaurant+2020+Milam+St+Columbus+TX+78934" target="_blank" rel="noopener">2020 Milam St, Columbus, TX 78934</a>
        </dd>
      </div>
    </dl>

    <section class="rsvp" aria-labelledby="rsvp-h">
      <p class="eyebrow" id="rsvp-h">RSVP</p>

      <form id="form" novalidate>
        <div style="display:flex;flex-direction:column;gap:18px">
          <h2>Will you join us?</h2>
          <p class="by" id="by" hidden></p>

          <div class="field" id="name-field" hidden>
            <label class="label" for="name">Your name</label>
            <input type="text" id="name" name="name" autocomplete="name" maxlength="120">
          </div>

          <fieldset class="choice">
            <legend class="label">Your reply</legend>
            <input type="radio" name="reply" id="r-yes" value="yes">
            <label for="r-yes">Yes, I’ll be there</label>
            <input type="radio" name="reply" id="r-no" value="no">
            <label for="r-no">Can’t make it</label>
          </fieldset>

          <div class="field" id="count-field">
            <span class="label" id="count-label">How many in your party</span>
            <div class="stepper" role="group" aria-labelledby="count-label">
              <button type="button" id="minus" aria-label="One fewer">−</button>
              <output id="count" aria-live="polite">1</output>
              <button type="button" id="plus" aria-label="One more">+</button>
            </div>
          </div>

          <div class="field">
            <label class="label" for="note">A note <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
            <textarea id="note" name="note" maxlength="500"></textarea>
          </div>

          <button class="btn block" type="submit" id="send">Send reply</button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </div>
      </form>

      <div class="done" id="done" hidden>
        <p class="big" id="done-big"></p>
        <p id="done-small"></p>
        <button class="btn ghost small" type="button" id="change">Change reply</button>
      </div>
    </section>

    <p class="foot" id="foot"></p>
